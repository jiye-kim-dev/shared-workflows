name: govulncheck (reusable)

on:
  workflow_call:
    inputs:
      goprivate:
        description: "GOPRIVATE 패턴. 비워 두면 private 모듈 설정을 건너뜀"
        type: string
        default: ""
      go-package:
        type: string
        default: "./..."
    secrets:
      go-private-token:
        required: false
      slack-webhook-url:
        required: false

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
      SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Private 모듈 접근 설정
        if: inputs.goprivate != ''
        env:
          TOKEN: ${{ secrets.go-private-token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::goprivate를 지정했으면 go-private-token secret도 넘겨야 합니다"
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/".insteadOf \
            "https://github.com/${{ github.repository_owner }}/"

      - name: govulncheck
        id: vuln   # Slack 알림 스텝에서 steps.vuln.outcome으로 이 스텝의 결과를 참조
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ${{ inputs.go-package }} > govulncheck.json
          jq -rs '
            (map(select(.osv)) | map({key: .osv.id, value: .osv.summary}) | from_entries) as $summary
            | [ .[] | select(.finding.trace[0].function) | .finding ]
            | unique_by(.osv)
            | .[]
            | "• <https://pkg.go.dev/vuln/\(.osv)|\(.osv)> \($summary[.osv] // "")\n      \(.trace[0].module)@\(.trace[0].version // "?") → 수정 버전: \(.fixed_version // "없음")"
          ' govulncheck.json > findings.txt
          cat findings.txt
          if [ -s findings.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then exit 1; fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Slack 알림
        if: >-
          !cancelled()
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && env.SLACK_WEBHOOK_URL != ''
        env:
          VULN_OUTCOME: ${{ steps.vuln.outcome }}
          TRIGGER: ${{ github.event_name == 'schedule' && '정기' || '수동' }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          repo="${{ github.repository }}"

          if [ "$VULN_FOUND" = "true" ]; then
            count=$(grep -c '^•' findings.txt)
            header=":rotating_light: *${repo}* 취약점 ${count}건 (${TRIGGER})"
            body=$(head -c 2500 findings.txt)
          elif [ "$VULN_OUTCOME" = "success" ]; then
            header=":white_check_mark: *${repo}* 취약점 없음 (${TRIGGER})"
            body=""
          else
            header=":warning: *${repo}* govulncheck 실행 실패 (${TRIGGER})"
            body="취약점이 아니라 실행 단계(checkout, 빌드, 모듈 다운로드 등)에서 실패했습니다."
          fi

          jq -n --arg text "${header}"$'\n'"${body}"$'\n'"<${run_url}|실행 로그>" '{text: $text}' \
            | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"